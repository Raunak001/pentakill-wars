name: ⚡ Nightly Pentakill Scrape

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC every night
  workflow_dispatch:        # manual trigger from the Actions tab

jobs:
  scrape:
    name: Fetch pentakills from dpm.lol & commit
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install requests

      - run: python scraper.py

      - name: Commit & push updated data.json
        run: |
          git config user.name  "Pentakill Wars Bot 🤖"
          git config user.email "bot@pentakill-wars.noreply"
          git add data.json
          git diff --staged --quiet \
            && echo "No changes." \
            || git commit -m "⚡ $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
