<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ PENTAKILL WARS ⚡</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;700;900&display=swap');

    :root {
      --hatz-color: #ff4d6d;
      --water-color: #00b4d8;
      --gold: #ffd60a;
      --bg: #0a0a0f;
      --card-bg: #12121c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Exo 2', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Starfield ── */
    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── Page ── */
    .page {
      position: relative; z-index: 1;
      padding: 32px 24px 56px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 36px; }

    .main-title {
      display: inline-block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 7vw, 6.5rem);
      letter-spacing: 8px;
      line-height: 1;
      background: linear-gradient(100deg, var(--hatz-color) 0%, var(--gold) 50%, var(--water-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #555;
      margin-top: 10px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,77,109,0.1);
      border: 1px solid rgba(255,77,109,0.35);
      color: var(--hatz-color);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-top: 14px;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--hatz-color);
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.15; } }

    /* ── Arena — 3-column: hero | VS | hero ── */
    .arena {
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      gap: 0;
      align-items: stretch;
      margin-bottom: 28px;
      min-height: 480px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    /* ── Hero panels (photo backgrounds) ── */
    .hero-panel {
      position: relative;
      overflow: hidden;
      min-height: 480px;
      cursor: default;
      transition: transform 0.4s ease;
    }
    .hero-panel:hover { transform: scale(1.01); z-index: 2; }

    /* The actual photo */
    .hero-photo {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-repeat: no-repeat;
      transition: transform 0.6s ease;
    }
    .hero-panel:hover .hero-photo { transform: scale(1.04); }

    .hero-panel.hatz .hero-photo {
      background-image: url('./hatz.jpg');
      background-position: center 18%;
    }
    .hero-panel.water .hero-photo {
      background-image: url('./water.jpg');
      background-position: center 52%;
    }

    /* Dark gradient overlay so text is readable */
    .hero-panel.hatz .hero-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,  rgba(10,10,15,0.08) 0%, rgba(10,10,15,0.72) 100%),
        linear-gradient(to bottom, rgba(10,10,15,0.15) 0%, rgba(10,10,15,0.85) 100%);
    }
    .hero-panel.water .hero-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to left,   rgba(10,10,15,0.08) 0%, rgba(10,10,15,0.72) 100%),
        linear-gradient(to bottom, rgba(10,10,15,0.15) 0%, rgba(10,10,15,0.85) 100%);
    }

    /* Color tint overlay */
    .hero-panel.hatz::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at 20% 50%, rgba(255,77,109,0.18) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-panel.water::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at 80% 50%, rgba(0,180,216,0.18) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Stats content — sits on top of everything */
    .hero-content {
      position: relative;
      z-index: 2;
      height: 100%;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      padding: 32px 36px;
    }

    /* Hatz: content on the LEFT */
    .hero-panel.hatz .hero-content {
      align-items: flex-start;
      justify-content: flex-end;
    }
    /* Water: content on the RIGHT */
    .hero-panel.water .hero-content {
      align-items: flex-end;
      justify-content: flex-end;
      text-align: right;
    }

    /* Crown */
    .crown-wrap {
      height: 44px;
      display: flex;
      align-items: center;
      margin-bottom: 2px;
    }
    .hero-panel.water .crown-wrap { justify-content: flex-end; }
    .crown {
      font-size: 2.2rem;
      display: inline-block;
      animation: crown-bob 0.9s ease-in-out infinite alternate;
    }
    @keyframes crown-bob {
      from { transform: translateY(0) rotate(-6deg); }
      to   { transform: translateY(-8px) rotate(6deg); }
    }

    .player-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 5vw, 4rem);
      letter-spacing: 6px;
      line-height: 1;
      margin-bottom: 4px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }
    .hero-panel.hatz  .player-name { color: var(--hatz-color);  text-shadow: 0 0 30px rgba(255,77,109,0.7), 0 2px 8px rgba(0,0,0,0.9); }
    .hero-panel.water .player-name { color: var(--water-color); text-shadow: 0 0 30px rgba(0,180,216,0.7), 0 2px 8px rgba(0,0,0,0.9); }

    .penta-count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 11vw, 9rem);
      line-height: 0.9;
      letter-spacing: 2px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.7);
    }
    .hero-panel.hatz  .penta-count { color: var(--hatz-color); text-shadow: 0 0 40px rgba(255,77,109,0.5), 0 4px 16px rgba(0,0,0,0.8); }
    .hero-panel.water .penta-count { color: var(--water-color); text-shadow: 0 0 40px rgba(0,180,216,0.5), 0 4px 16px rgba(0,0,0,0.8); }

    .penta-label {
      font-size: 0.65rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
      margin-bottom: 16px;
    }

    .status-badge {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 20px;
      display: inline-block;
    }
    .status-winning { background: rgba(255,214,10,0.2);  color: var(--gold);  border: 1px solid rgba(255,214,10,0.55); }
    .status-losing  { background: rgba(0,0,0,0.35);       color: #555;         border: 1px solid #252525; }
    .status-tied    { background: rgba(255,255,255,0.07); color: #666;         border: 1px solid #2e2e2e; }

    /* Winner border glow on hero panel */
    .hero-panel.hatz {
      box-shadow: inset 0 0 0 2px rgba(255,77,109,0.3);
    }
    .hero-panel.water {
      box-shadow: inset 0 0 0 2px rgba(0,180,216,0.3);
    }
    .hero-panel.hatz.winner {
      box-shadow:
        inset 0 0 0 3px var(--hatz-color),
        0 0 60px rgba(255,77,109,0.4),
        0 0 120px rgba(255,77,109,0.15);
      animation: pulse-hatz 2s ease-in-out infinite;
    }
    .hero-panel.water.winner {
      box-shadow:
        inset 0 0 0 3px var(--water-color),
        0 0 60px rgba(0,180,216,0.4),
        0 0 120px rgba(0,180,216,0.15);
      animation: pulse-water 2s ease-in-out infinite;
    }
    @keyframes pulse-hatz {
      0%,100% { box-shadow: inset 0 0 0 3px var(--hatz-color), 0 0 45px rgba(255,77,109,0.3); }
      50%      { box-shadow: inset 0 0 0 3px var(--hatz-color), 0 0 80px rgba(255,77,109,0.6), 0 0 140px rgba(255,77,109,0.2); }
    }
    @keyframes pulse-water {
      0%,100% { box-shadow: inset 0 0 0 3px var(--water-color), 0 0 45px rgba(0,180,216,0.3); }
      50%      { box-shadow: inset 0 0 0 3px var(--water-color), 0 0 80px rgba(0,180,216,0.6), 0 0 140px rgba(0,180,216,0.2); }
    }

    /* ── VS divider column ── */
    .vs-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 4px;
      background: linear-gradient(to bottom, transparent, rgba(255,214,10,0.04), transparent);
      position: relative;
      z-index: 3;
    }
    .vs-col::before {
      content: '';
      position: absolute;
      top: 15%; bottom: 15%;
      left: 50%; transform: translateX(-50%);
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(255,214,10,0.35), transparent);
    }
    .vs-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      color: var(--gold);
      text-shadow: 0 0 25px rgba(255,214,10,0.8);
      letter-spacing: 2px;
    }
    .zap {
      font-size: 1.8rem;
      animation: zap-anim 0.55s ease-in-out infinite alternate;
    }
    @keyframes zap-anim {
      from { transform: scale(1) rotate(-12deg); opacity: 0.6; }
      to   { transform: scale(1.35) rotate(12deg); opacity: 1; }
    }
    .diff-pill {
      background: var(--gold);
      color: #000;
      font-weight: 900;
      font-size: 0.6rem;
      letter-spacing: 1.2px;
      padding: 5px 10px;
      border-radius: 14px;
      white-space: nowrap;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
    }

    /* ── Trash talk ── */
    .trash-box {
      background: linear-gradient(135deg, #13132a 0%, #0e1829 100%);
      border: 1px solid #1f1f3a;
      border-radius: 14px;
      padding: 20px 28px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }
    .trash-box::before {
      content: '💬';
      position: absolute;
      left: 18px; top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      opacity: 0.35;
    }
    .trash-label {
      font-size: 0.6rem;
      letter-spacing: 3px;
      color: #3a3a5a;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .trash-text {
      font-size: 1rem;
      font-weight: 700;
      color: #ccc;
      min-height: 1.5em;
      transition: opacity 0.45s ease;
    }

    /* ── Footer ── */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.7rem;
      color: #333;
      letter-spacing: 1px;
      padding-top: 16px;
      border-top: 1px solid #18182a;
    }
    .footer-row a { color: #444; text-decoration: none; }
    .footer-row a:hover { color: #999; }

    /* ── Confetti ── */
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      border-radius: 2px;
      animation: fall var(--d, 3s) linear var(--delay, 0s) forwards;
    }
    @keyframes fall {
      0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(800deg); opacity: 0; }
    }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      .arena {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .vs-col {
        flex-direction: row;
        min-height: 60px;
        background: rgba(255,214,10,0.04);
      }
      .vs-col::before { display: none; }
      .diff-pill {
        writing-mode: horizontal-tb;
        transform: none;
      }
      .hero-panel.hatz .hero-content,
      .hero-panel.water .hero-content {
        align-items: flex-start;
        text-align: left;
      }
      .hero-panel.water .crown-wrap { justify-content: flex-start; }
    }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="page">
  <header>
    <div class="main-title">⚡ PENTAKILL WARS ⚡</div>
    <div class="subtitle">The only stat that matters</div>
    <div class="live-pill"><span class="live-dot"></span> Live Scoreboard</div>
  </header>

  <div class="arena">

    <!-- HATZ — full hero panel -->
    <div class="hero-panel hatz" id="panel-hatz">
      <div class="hero-photo"></div>
      <div class="hero-content">
        <div class="crown-wrap"><span id="crown-hatz"></span></div>
        <div class="player-name">Hatz</div>
        <div class="penta-count" id="count-hatz">—</div>
        <div class="penta-label">Pentakills in ARAM</div>
        <span class="status-badge status-tied" id="status-hatz">Loading…</span>
      </div>
    </div>

    <!-- VS divider -->
    <div class="vs-col">
      <div class="vs-text">VS</div>
      <div class="zap">⚡</div>
      <div class="diff-pill" id="diff-pill">—</div>
    </div>

    <!-- WATER — full hero panel -->
    <div class="hero-panel water" id="panel-water">
      <div class="hero-photo"></div>
      <div class="hero-content">
        <div class="crown-wrap"><span id="crown-water"></span></div>
        <div class="player-name">Water</div>
        <div class="penta-count" id="count-water">—</div>
        <div class="penta-label">Pentakills in ARAM</div>
        <span class="status-badge status-tied" id="status-water">Loading…</span>
      </div>
    </div>

  </div>

  <div class="trash-box">
    <div class="trash-label">The Commentary Box</div>
    <div class="trash-text" id="trash-text">Crunching the numbers…</div>
  </div>

  <div class="footer-row">
    <span>Updated: <span id="last-updated">—</span></span>
    <span>Refreshes nightly at midnight · Data from <a href="https://dpm.lol" target="_blank">dpm.lol</a></span>
  </div>
</div>

<script>
/* ── Starfield ─────────────────────────────────────────── */
(function () {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 220 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.2,
      a: Math.random(),
      da: (Math.random() * 0.004 + 0.001) * (Math.random() < 0.5 ? 1 : -1),
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.a += s.da;
      if (s.a < 0.05 || s.a > 0.95) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a.toFixed(2)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

/* ── Confetti ───────────────────────────────────────────── */
function confetti(n = 50) {
  const colors = ['#ff4d6d','#00b4d8','#ffd60a','#a8ff78','#ff6b35','#c77dff'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    const size = Math.random() * 9 + 5;
    el.style.cssText = `
      left:${Math.random()*100}vw;
      width:${size}px; height:${size}px;
      background:${colors[~~(Math.random()*colors.length)]};
      border-radius:${Math.random()>0.5?'50%':'3px'};
      --d:${(Math.random()*2+2).toFixed(1)}s;
      --delay:${(Math.random()*1.8).toFixed(2)}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ── Trash talk ─────────────────────────────────────────── */
const TRASH = {
  hatzBig: [
    "Hatz is out here collecting pentakills like Pokémon 🃏",
    "Water's champion pool is considering early retirement 😔",
    "Hatz pentakilling his way into Water's nightmares 🌙",
    "The gap is so large it has its own Zilean ult ⏳",
    "Water when he checks the scoreboard: 🙂 (he is not okay)",
    "Hatz said 'I eat ARAMs for breakfast' and he absolutely meant it 🍳",
    "Water's therapist is going to have a very busy week 📋",
  ],
  waterBig: [
    "Water collecting pentakills like it's a full-time job 💼",
    "Hatz is down so bad even his team feels bad for him 😬",
    "Water out here pentakilling like it's a personality trait 💧",
    "The only thing rising faster than Water's count is Hatz's blood pressure 📈",
    "Water said 'hold my Nunu' and went absolutely feral ❄️",
    "Hatz staring at this scoreboard like it personally wronged him 👀",
    "Water's pentakills have their own Wikipedia page at this point 📚",
  ],
  close: [
    "THIS IS TOO CLOSE. Someone pick Sivir. NOW. 😤",
    "Neck and neck — just like their mutual hatred of losing 🤝",
    "One pentakill away from glory or grief. No pressure 👀",
    "The tension is thicker than Mundo's health bar 💪",
    "It could go either way. Both players are equally delusional 🫠",
    "The scoreboard is dangerously spicy right now 🌶️",
  ],
  tied: [
    "DEAD EVEN. One of them needs to get good. Like right now. 🚨",
    "They're tied. Both should be embarrassed. Equally. 😐",
    "Perfect symmetry. Equal skill. Equal cringe. 🪞",
    "Tied score = a diplomatic incident waiting to happen 💣",
    "Fate has them at 0-0. Fate is clearly trolling 🎭",
  ],
  noData: [
    "Scoreboard is loading... or they both went AFK 🤔",
    "No data yet. Run the scraper and witness the carnage 🗡️",
  ],
};

function pickLine(h, w) {
  const diff = Math.abs(h - w);
  let pool;
  if (h === 0 && w === 0) pool = TRASH.noData;
  else if (h === w)        pool = TRASH.tied;
  else if (diff <= 2)      pool = TRASH.close;
  else if (h > w)          pool = TRASH.hatzBig;
  else                     pool = TRASH.waterBig;
  return pool[~~(Math.random() * pool.length)];
}

/* ── Render ─────────────────────────────────────────────── */
let trashTimer;

function render(d) {
  const h = d.hatz.pentakills;
  const w = d.water.pentakills;
  const diff = h - w;
  const absDiff = Math.abs(diff);

  document.getElementById('count-hatz').textContent  = h;
  document.getElementById('count-water').textContent = w;
  document.getElementById('last-updated').textContent = d.lastUpdated || 'Unknown';

  const pill = document.getElementById('diff-pill');
  pill.textContent = absDiff === 0 ? 'TIED' : `+${absDiff} ${diff > 0 ? 'HATZ' : 'WATER'}`;

  const panelH = document.getElementById('panel-hatz');
  const panelW = document.getElementById('panel-water');
  const crownH = document.getElementById('crown-hatz');
  const crownW = document.getElementById('crown-water');
  const stH    = document.getElementById('status-hatz');
  const stW    = document.getElementById('status-water');

  [panelH, panelW].forEach(el => el.classList.remove('winner'));
  crownH.textContent = ''; crownH.className = '';
  crownW.textContent = ''; crownW.className = '';

  if (diff > 0) {
    panelH.classList.add('winner');
    crownH.textContent = '👑'; crownH.className = 'crown';
    stH.textContent = '🔥 Winning'; stH.className = 'status-badge status-winning';
    stW.textContent = '💀 Losing';  stW.className = 'status-badge status-losing';
    confetti(45);
  } else if (diff < 0) {
    panelW.classList.add('winner');
    crownW.textContent = '👑'; crownW.className = 'crown';
    stW.textContent = '🔥 Winning'; stW.className = 'status-badge status-winning';
    stH.textContent = '💀 Losing';  stH.className = 'status-badge status-losing';
    confetti(45);
  } else {
    stH.textContent = '🤝 Tied'; stH.className = 'status-badge status-tied';
    stW.textContent = '🤝 Tied'; stW.className = 'status-badge status-tied';
  }

  clearInterval(trashTimer);
  const el = document.getElementById('trash-text');
  const rotate = () => {
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = pickLine(h, w); el.style.opacity = '1'; }, 380);
  };
  rotate();
  trashTimer = setInterval(rotate, 6500);
}

/* ── Load data ──────────────────────────────────────────── */
async function loadData() {
  try {
    const res = await fetch(`data.json?v=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
  } catch (err) {
    document.getElementById('trash-text').textContent =
      "⚠️ Couldn't load data.json — make sure the scraper has run at least once!";
    console.error(err);
  }
}

loadData();
</script>
</body>
</html>
